<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: header}">

</head>
<body>
<a class="btn btn-primary"
   th:href="@{/admin/clients/nouveau}">
  Nouveau client
</a>

  <table class="table table-striped table-hover table-bordered align-middle">
    <tr>
      <th>Prénom</th>
      <th>Nom</th>
      <th>Mail</th>
      <th>Téléphone</th>
      <th>Actions</th>
    </tr>
    <tr th:each="client : ${clients}">
      <td th:text="${client.firstName}"></td>
      <td th:text="${client.lastName}"></td>
      <td th:text="${client.mail}"></td>
      <td th:text="${client.phoneNumber}"></td>
      <td>
        <div class="d-flex align-items-center gap-1 mb-3">
          <a class = "btn btn-primary"th:href="@{/admin/clients/{id}/modifier(id=${client.id})}">Modifier</a>
          <button th:onclick="|deleteClient(${client.id})|">Supprimer</button>


        </div>
      </td>
    </tr>
  </table>


<script>


    function deleteClient(id) {
    if (!confirm("Supprimer ce client ?")) return;

    fetch(`/admin/clients/${id}/supprimer`, {
    method: 'POST'
  }).then(() => location.reload());
  }
</script>
</body>
</html>
